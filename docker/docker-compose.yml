# Local development services: `npm run db:up` (or `docker compose -f docker/docker-compose.yml up -d`).
# Host port 5433 so it can run alongside other projects' Postgres on 5432.
name: mficrm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mficrm
      POSTGRES_PASSWORD: mficrm
      POSTGRES_DB: mficrm
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mficrm']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
